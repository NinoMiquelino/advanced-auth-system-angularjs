<div class="login-container">
  <div class="card">
    <h2>Login</h2>
    
    <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
      <div class="form-group">
        <label>Email:</label>
        <input type="email" formControlName="email" class="form-control">
      </div>
      
      <div class="form-group">
        <label>Password:</label>
        <input type="password" formControlName="password" class="form-control">
      </div>
      
      <button type="submit" class="btn btn-primary" [disabled]="!loginForm.valid">
        Login with Password
      </button>
    </form>

    <div class="separator">OR</div>

    <form [formGroup]="webauthnForm" (ngSubmit)="onWebAuthnLogin()">
      <div class="form-group">
        <label>Email for WebAuthn:</label>
        <input type="email" formControlName="email" class="form-control">
      </div>
      
      <button type="submit" class="btn btn-secondary" [disabled]="!webauthnForm.valid">
        Login with WebAuthn
      </button>
    </form>

    <div *ngIf="error" class="error-message">
      {{ error }}
    </div>

    <div class="links">
      <a routerLink="/register">Create account</a>
    </div>
  </div>
</div>
